services:
  - type: web
    name: worldmaster
    runtime: ruby
    rubyVersion: 3.2.2
    plan: free
    branch: main
    autoDeployTrigger: commit
    buildCommand: "./bin/render-build.sh"
    preDeployCommand: "bundle exec rails db:migrate db:seed"
    startCommand: "bundle exec puma -C config/puma.rb"
    envVars:
      - key: RAILS_ENV
        value: production
      - key: SECRET_KEY_BASE
        generateValue: true
      - key: RAILS_MASTER_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: worldmaster-db
          property: connectionString

databases:
  - name: worldmaster-db
    plan: free
    databaseName: worldmaster_production
    user: worldmaster
    postgresMajorVersion: "17"
    ipAllowList: []
