services:
  - type: web
    name: worldmaster
    runtime: ruby
    rubyVersion: 3.2.2
    branch: main
    autoDeploy: true
    buildCommand: "./bin/render-build.sh"
    startCommand: "bundle exec puma -C config/puma.rb"
    envVars:
      - key: RAILS_ENV
        value: production
      - key: SECRET_KEY_BASE
        generateValue: true
      - key: RAILS_MASTER_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: worldmaster-db
          property: connectionString

  - type: pserv
    name: worldmaster-db
    runtime: postgres
    envVars:
      - key: POSTGRES_PASSWORD
        generateValue: true
      - key: POSTGRES_DB
        value: worldmaster_production
